<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<rect x="0" y="0" width="860" height="320" fill="#fdfbf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2d2d"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="30" y="60" width="200" height="50" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="130.0" y="90.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thread A running</text>
<rect x="290" y="50" width="190" height="36" rx="9" fill="#faf0e6" stroke="#a06030" stroke-width="2"/>
<text x="385.0" y="66.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">save registers + PC + SP</text>
<text x="385.0" y="83.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">~tens of ns</text>
<rect x="290" y="95" width="190" height="36" rx="9" fill="#faf0e6" stroke="#a06030" stroke-width="2"/>
<text x="385.0" y="111.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TLB / ASID transition</text>
<text x="385.0" y="128.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">variable cost</text>
<rect x="290" y="140" width="190" height="55" rx="9" fill="#d8e8df" stroke="#5a8870" stroke-width="2"/>
<text x="385.0" y="158.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cold cache, Thread B</text>
<text x="385.0" y="175.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">x x x x x x x (misses)</text>
<text x="385.0" y="190.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">dominant cost, paid over us</text>
<rect x="530" y="60" width="220" height="50" rx="9" fill="#fef3f0" stroke="#c0392b" stroke-width="2"/>
<text x="640.0" y="83.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thread B running, slow start</text>
<text x="640.0" y="100.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">fades back to normal as cache warms</text>
<path d="M230,85 L260,85" fill="none" stroke="#2d2d2d" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,40 L260,260" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="260.0" y="40.0" font-size="11" fill="#fdfbf7" stroke="#fdfbf7" stroke-width="3" paint-order="stroke" text-anchor="middle">context switch</text>
<text x="260.0" y="40.0" font-size="11" fill="#c0392b" text-anchor="middle">context switch</text>
<path d="M480,167 L530,90" fill="none" stroke="#2d2d2d" stroke-width="2" marker-end="url(#a)"/>
<text x="515.0" y="122.5" font-size="11" fill="#fdfbf7" stroke="#fdfbf7" stroke-width="3" paint-order="stroke" text-anchor="middle">cache warms back up</text>
<text x="515.0" y="122.5" font-size="11" fill="#2d2d2d" text-anchor="middle">cache warms back up</text>
<text x="430" y="24" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A context switch&#x27;s hidden cost</text>
<text x="430" y="300" font-size="11" fill="#1a1a1a" text-anchor="middle">the switch itself is cheap; refilling the cache it evicted is not.</text>
</svg>