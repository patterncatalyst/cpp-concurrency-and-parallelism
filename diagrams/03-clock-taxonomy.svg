<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<rect x="0" y="0" width="880" height="290" fill="#fdfbf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2d2d"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="300" y="58" width="100" height="24" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="350.0" y="75.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">deadline</text>
<rect x="600" y="78" width="150" height="24" rx="9" fill="#fef3f0" stroke="#c0392b" stroke-width="2"/>
<text x="675.0" y="95.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">deadline recedes</text>
<rect x="300" y="168" width="130" height="24" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="365.0" y="185.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">deadline (fixed)</text>
<path d="M60,90 L400,90" fill="none" stroke="#2d2d2d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M400,90 L380,105" fill="none" stroke="#2d2d2d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M380,105 L780,105" fill="none" stroke="#2d2d2d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M430,66 L400,88" fill="none" stroke="#2d2d2d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M60,200 L780,200" fill="none" stroke="#2d2d2d" stroke-width="2" marker-end="url(#a)"/>
<text x="440" y="24" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Wall clock vs. steady clock under an NTP step</text>
<text x="60" y="46" font-size="12" fill="#4a73b8" text-anchor="start" font-weight="700">system_clock (wall time)</text>
<text x="60" y="175" font-size="12" fill="#5a8870" text-anchor="start" font-weight="700">steady_clock (monotonic)</text>
<text x="430" y="62" font-size="11" fill="#6b6b6b" text-anchor="middle">NTP correction</text>
<text x="680" y="135" font-size="11" fill="#c0392b" text-anchor="middle">a dead peer looks alive a little longer.</text>
<text x="430" y="255" font-size="11" fill="#5a8870" text-anchor="middle">timeout fires on real elapsed time.</text>
</svg>