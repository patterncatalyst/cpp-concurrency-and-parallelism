<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<rect x="0" y="0" width="860" height="450" fill="#fdfbf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2d2d"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="30" y="46" width="800" height="180" rx="12" fill="#fbfaf6" stroke="#e8e1d3"/>
<text x="42" y="66" font-size="12" font-weight="700" fill="#6b6b6b">std::lock_guard, opposing order</text>
<rect x="30" y="246" width="800" height="180" rx="12" fill="#fbfaf6" stroke="#e8e1d3"/>
<text x="42" y="266" font-size="12" font-weight="700" fill="#6b6b6b">std::scoped_lock, same opposing order</text>
<rect x="60" y="84" width="220" height="66" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="170.0" y="107.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thread 1</text>
<text x="170.0" y="124.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">lock_guard x(a)</text>
<text x="170.0" y="139.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">then lock_guard y(b)</text>
<rect x="580" y="84" width="220" height="66" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="690.0" y="107.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thread 2</text>
<text x="690.0" y="124.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">lock_guard x(b)</text>
<text x="690.0" y="139.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">then lock_guard y(a)</text>
<rect x="310" y="162" width="240" height="46" rx="9" fill="#fef3f0" stroke="#c0392b" stroke-width="2"/>
<text x="430.0" y="183.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">deadlock</text>
<text x="430.0" y="200.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">no error, no exception -- program stops</text>
<rect x="60" y="284" width="220" height="66" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="170.0" y="315.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thread 1</text>
<text x="170.0" y="332.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">scoped_lock lock(a, b)</text>
<rect x="580" y="284" width="220" height="66" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="690.0" y="315.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thread 2</text>
<text x="690.0" y="332.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">scoped_lock lock(b, a)</text>
<rect x="310" y="372" width="240" height="46" rx="9" fill="#d8e8df" stroke="#5a8870" stroke-width="2"/>
<text x="430.0" y="393.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">both complete</text>
<text x="430.0" y="410.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle">order does not matter to scoped_lock</text>
<path d="M280,97 L580,137" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#am)"/>
<text x="436.0" y="111.0" font-size="11" fill="#fdfbf7" stroke="#fdfbf7" stroke-width="3" paint-order="stroke" text-anchor="middle">each holds what the other needs</text>
<text x="436.0" y="111.0" font-size="11" fill="#c0392b" text-anchor="middle">each holds what the other needs</text>
<path d="M580,97 L280,137" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#am)"/>
<path d="M170,150 L370,162" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#am)"/>
<path d="M690,150 L490,162" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#am)"/>
<path d="M280,317 L580,317" fill="none" stroke="#2d2d2d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="436.0" y="311.0" font-size="11" fill="#fdfbf7" stroke="#fdfbf7" stroke-width="3" paint-order="stroke" text-anchor="middle">try-all, back off, retry -- not argument order</text>
<text x="436.0" y="311.0" font-size="11" fill="#2d2d2d" text-anchor="middle">try-all, back off, retry -- not argument order</text>
<path d="M170,350 L370,372" fill="none" stroke="#2d2d2d" stroke-width="2" marker-end="url(#a)"/>
<path d="M690,350 L490,372" fill="none" stroke="#2d2d2d" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="24" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Lock ordering and deadlock: lock_guard vs. scoped_lock</text>
</svg>