<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<rect x="0" y="0" width="820" height="420" fill="#fdfbf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d2d2d"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="60" y="60" width="700" height="70" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="410.0" y="85.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">thread stack</text>
<text x="410.0" y="102.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">several MiB, kernel-scheduled</text>
<text x="410.0" y="117.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">task_struct + tid in /proc</text>
<rect x="140" y="180" width="540" height="60" rx="9" fill="#faf0e6" stroke="#a06030" stroke-width="2"/>
<text x="410.0" y="200.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">fiber stack</text>
<text x="410.0" y="217.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">~100 KiB, user-scheduled, invisible to kernel</text>
<text x="410.0" y="232.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">suspends from ANY ordinary function</text>
<rect x="220" y="290" width="380" height="50" rx="9" fill="#d8e8df" stroke="#5a8870" stroke-width="2"/>
<text x="410.0" y="305.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">coroutine frame</text>
<text x="410.0" y="322.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">tens of bytes up, user-scheduled</text>
<text x="410.0" y="337.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">suspends ONLY at co_await</text>
<rect x="60" y="360" width="700" height="45" rx="9" fill="#fef3f0" stroke="#c0392b" stroke-width="2"/>
<text x="410.0" y="388.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cost and capability move together, in opposite directions</text>
<path d="M410,130 L410,180" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#am)"/>
<text x="416.0" y="149.0" font-size="11" fill="#fdfbf7" stroke="#fdfbf7" stroke-width="3" paint-order="stroke" text-anchor="middle">many fibers fit in one thread&#x27;s stack</text>
<text x="416.0" y="149.0" font-size="11" fill="#c0392b" text-anchor="middle">many fibers fit in one thread&#x27;s stack</text>
<path d="M410,240 L410,290" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#am)"/>
<text x="416.0" y="259.0" font-size="11" fill="#fdfbf7" stroke="#fdfbf7" stroke-width="3" paint-order="stroke" text-anchor="middle">many frames fit in one fiber&#x27;s stack</text>
<text x="416.0" y="259.0" font-size="11" fill="#c0392b" text-anchor="middle">many frames fit in one fiber&#x27;s stack</text>
<text x="410" y="24" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Three ways to hold a paused computation</text>
</svg>