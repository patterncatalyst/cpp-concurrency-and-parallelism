<rect x="25" y="55" width="815" height="455" rx="12" fill="#fbfaf6" stroke="#e8e1d3"/>
<text x="37" y="75" font-size="12" font-weight="700" fill="#6b6b6b">ThreadSanitizer report — racy_counter.cpp:14</text>
