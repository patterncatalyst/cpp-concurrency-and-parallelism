<text x="205.0" y="460.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">SUMMARY: data race</text>
<text x="205.0" y="477.5" font-size="11.5" fill="#d7d7d7" text-anchor="middle">racy_counter.cpp:14</text>
<rect x="430" y="435" width="380" height="55" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="620.0" y="460.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">one line per distinct race</text>
<text x="620.0" y="477.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">process exits nonzero once all threads finish</text>
