<rect x="50" y="435" width="14" height="55" rx="9" fill="#faf0e6" stroke="#a06030" stroke-width="2"/>
<text x="57.0" y="468.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle"></text>
