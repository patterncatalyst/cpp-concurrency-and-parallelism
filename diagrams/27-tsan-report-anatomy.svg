<path d="M335,462 L430,462" fill="none" stroke="#2d2d2d" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="26" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Anatomy of a ThreadSanitizer Report</text>
<text x="430" y="537" font-size="11" fill="#6b6b6b" text-anchor="middle">every fact comes from TSan&#x27;s per-thread vector clock — updated at unlock/lock, atomic release/acquire, join</text>
