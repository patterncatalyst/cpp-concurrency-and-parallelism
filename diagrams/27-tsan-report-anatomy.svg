<text x="57.0" y="128.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle"></text>
<rect x="75" y="95" width="260" height="55" rx="9" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
<text x="205.0" y="120.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Write of size 4 ... by</text>
<text x="205.0" y="137.5" font-size="11.5" fill="#d7d7d7" text-anchor="middle">thread T2</text>
<rect x="430" y="95" width="380" height="55" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="620.0" y="120.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">conflicting access #1</text>
<text x="620.0" y="137.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">full call stack to the exact source line</text>
<rect x="50" y="180" width="14" height="55" rx="9" fill="#fef3f0" stroke="#c0392b" stroke-width="2"/>
<text x="57.0" y="213.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle"></text>
<rect x="75" y="180" width="260" height="55" rx="9" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
<text x="205.0" y="205.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Previous write ... by</text>
<text x="205.0" y="222.5" font-size="11.5" fill="#d7d7d7" text-anchor="middle">thread T1</text>
<rect x="430" y="180" width="380" height="55" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="620.0" y="205.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">conflicting access #2</text>
<text x="620.0" y="222.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">no happens-before edge between T1, T2 writes</text>
<rect x="50" y="265" width="14" height="55" rx="9" fill="#e8f0fb" stroke="#4a73b8" stroke-width="2"/>
<text x="57.0" y="298.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle"></text>
<rect x="75" y="265" width="260" height="55" rx="9" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
<text x="205.0" y="290.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Location is global</text>
<text x="205.0" y="307.5" font-size="11.5" fill="#d7d7d7" text-anchor="middle">counter</text>
<rect x="430" y="265" width="380" height="55" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="620.0" y="290.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">what was raced on</text>
<text x="620.0" y="307.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle">a heap location also reports its allocation-site stack</text>
<rect x="50" y="350" width="14" height="55" rx="9" fill="#d8e8df" stroke="#5a8870" stroke-width="2"/>
<text x="57.0" y="383.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle"></text>
<rect x="75" y="350" width="260" height="55" rx="9" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
<text x="205.0" y="375.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Thread T2 created by</text>
<text x="205.0" y="392.5" font-size="11.5" fill="#d7d7d7" text-anchor="middle">main thread</text>
<rect x="430" y="350" width="380" height="55" rx="9" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5"/>
<text x="620.0" y="375.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">parentage reconstruction</text>
