<text x="430" y="26" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ThreadSanitizer vs. Helgrind: Two Mechanisms, One Report</text>
<text x="430" y="390" font-size="11" fill="#a06030" text-anchor="middle">TSan reports only a conflict this run executed; Helgrind&#x27;s lockset model can flag a lock-order risk no run has hit yet</text>
