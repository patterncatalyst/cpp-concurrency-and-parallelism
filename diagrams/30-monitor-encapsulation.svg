<text x="460" y="24" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Enforcement vs. Convention: Monitor&lt;T&gt; vs. Comment-Guarded Access</text>
<text x="35" y="72" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Comment-guarded (not enforced)</text>
<text x="485" y="72" font-size="13" fill="#5a8870" text-anchor="start" font-weight="700">Monitor&lt;T&gt; (structurally enforced)</text>
<text x="235" y="300" font-size="11" fill="#c0392b" text-anchor="middle">both bypasses compile fine</text>
<text x="810" y="260" font-size="10.5" fill="#6b6b6b" text-anchor="middle">no path to value_ except</text>
<text x="810" y="274" font-size="10.5" fill="#6b6b6b" text-anchor="middle">through the lock</text>
<text x="460" y="404" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">the compiler enforces the wrapper&#x27;s rule; it cannot enforce the comment.</text>
