<text x="450" y="24" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">cpu.max Throttling vs. cpuset.cpus Pinning: Same Host, Two Core Counts</text>
<text x="35" y="120" font-size="10.5" fill="#6b6b6b" text-anchor="start">one 100ms period (repeats)</text>
<text x="35" y="200" font-size="10.5" fill="#c0392b" text-anchor="start">aggregate runtime across ALL used</text>
<text x="35" y="213" font-size="10.5" fill="#c0392b" text-anchor="start">cores counted against one quota</text>
<text x="718" y="122" font-size="10.5" fill="#5a8870" text-anchor="middle" font-weight="700">100% usable, no throttling</text>
<text x="670" y="165" font-size="10.5" fill="#6b6b6b" text-anchor="middle">scheduler excludes every other core</text>
<text x="670" y="178" font-size="10.5" fill="#6b6b6b" text-anchor="middle">outright: no period, no budget to exhaust</text>
<text x="450" y="270" font-size="11" fill="#a06030" text-anchor="middle" font-weight="700">same &#x27;--cpus=2&#x27; request, two different enforcement mechanisms</text>
